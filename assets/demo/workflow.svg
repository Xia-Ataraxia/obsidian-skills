<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">From a neutral research note to a verified visual map</title><desc id="desc">Illustrated workflow, not an application screenshot: inspect a synthetic field note, select the independent format owner, then validate structure and read back the exact result. Application rendering remains a separate check.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10162a"/><stop offset="1" stop-color="#202444"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#a9a2ff" stroke-width="2"/></marker></defs>
<rect width="1200" height="540" rx="24" fill="url(#bg)"/>
<g font-family="system-ui, sans-serif"><text x="48" y="57" fill="#a9a2ff" font-size="13" letter-spacing="3">ONE TASK · EXPLICIT OWNERS · OBSERVABLE RESULTS</text><text x="48" y="108" fill="#f4f3ff" font-size="32" font-weight="700">Turn a field note into a map you can trust.</text>
<g fill="#191e35" stroke="#414664"><rect x="48" y="151" width="328" height="289" rx="16"/><rect x="436" y="151" width="328" height="289" rx="16"/><rect x="824" y="151" width="328" height="289" rx="16"/></g>
<g fill="#bab4ff" font-size="12" font-weight="700" letter-spacing="2"><text x="72" y="187">01 / INSPECT</text><text x="460" y="187">02 / CHOOSE</text><text x="848" y="187">03 / VERIFY</text></g>
<g fill="#f4f3ff" font-size="22" font-weight="650"><text x="72" y="226">A small, neutral source</text><text x="460" y="226">Only the needed skill</text><text x="848" y="226">Structure + readback</text></g>
<g fill="#c4c8dc" font-size="16"><text x="72" y="272">Field study</text><text x="72" y="301">Question → observations</text><text x="72" y="330">Evidence → next experiment</text><text x="72" y="389">Keep unrelated notes intact.</text><text x="460" y="272">Markdown: preserve the note</text><text x="460" y="301">Canvas: connect the ideas</text><text x="460" y="330">Visualize: explain the choice</text><text x="460" y="389">No mandatory router.</text><text x="848" y="272">Stable node and edge IDs</text><text x="848" y="301">Exact destination resolved</text><text x="848" y="330">Non-target hashes unchanged</text><text x="848" y="389">Render in the target app.</text></g>
<g stroke="#a9a2ff" stroke-width="2" marker-end="url(#arrow)"><path d="M389 295H422"/><path d="M777 295H810"/></g><text x="48" y="490" fill="#a9aec7" font-size="14">Synthetic illustration · No private notes · Not a screenshot or live-render verification claim</text></g></svg>
