<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400"
     role="img" aria-labelledby="osHeroTitle osHeroDesc">
  <title id="osHeroTitle">Obsidian Skills — nine independent Agent Skills for Obsidian vaults</title>
  <desc id="osHeroDesc">An original geometric banner. On the left, a diamond lattice of nine equal facets sits
    beside the wordmark "Obsidian Skills", the line "Nine independent Agent Skills for Obsidian vaults", the
    package names Markdown, Bases, Canvas, Mermaid, Visualize, CLI, Clipper, Doctor and Sync, and a badge
    reading "LOCAL / UNRELEASED 0.1.0". On the right, nine separate rounded tiles each hold one abstract line
    glyph, in reading order: double brackets for Markdown, a three-row table for Bases, three linked nodes for
    Canvas, a decision diamond for Mermaid, a bar chart for Visualize, a prompt chevron for CLI, a clipped page
    for Clipper, a pulse trace in a circle for Doctor, and a two-arc cycle for Sync. No tile is larger or
    central. This is a drawn diagram, not a screenshot of the Obsidian application.</desc>

  <defs>
    <linearGradient id="osHeroPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1533"/>
      <stop offset="0.48" stop-color="#120e22"/>
      <stop offset="1" stop-color="#08060e"/>
    </linearGradient>
    <radialGradient id="osHeroGlowL" gradientUnits="userSpaceOnUse" cx="150" cy="130" r="440">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="osHeroGlowR" gradientUnits="userSpaceOnUse" cx="1046" cy="200" r="300">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="osHeroMarkPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241c45"/>
      <stop offset="1" stop-color="#0b0814"/>
    </linearGradient>
    <linearGradient id="osHeroFacet" gradientUnits="userSpaceOnUse" x1="-88" y1="-94" x2="88" y2="94">
      <stop offset="0" stop-color="#c8b8ff"/>
      <stop offset="0.40" stop-color="#8b5cf6"/>
      <stop offset="0.76" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Self-contained panel so the banner reads on light and dark page backgrounds alike. -->
  <rect x="0" y="0" width="1280" height="400" rx="28" fill="url(#osHeroPanel)"/>
  <rect x="0" y="0" width="1280" height="400" rx="28" fill="url(#osHeroGlowL)"/>
  <rect x="0" y="0" width="1280" height="400" rx="28" fill="url(#osHeroGlowR)"/>

  <!-- Mark: the same nine-facet lattice as assets/brand/logo.svg, scaled down. -->
  <g transform="translate(126 242) scale(0.421875)">
    <rect x="-126" y="-126" width="252" height="252" rx="56" fill="url(#osHeroMarkPanel)"/>
    <g transform="rotate(45)" fill="url(#osHeroFacet)">
      <rect x="-77" y="-77" width="46" height="46" rx="7"/>
      <rect x="-23" y="-77" width="46" height="46" rx="7"/>
      <rect x="31"  y="-77" width="46" height="46" rx="7"/>
      <rect x="-77" y="-23" width="46" height="46" rx="7"/>
      <rect x="-23" y="-23" width="46" height="46" rx="7"/>
      <rect x="31"  y="-23" width="46" height="46" rx="7"/>
      <rect x="-77" y="31"  width="46" height="46" rx="7"/>
      <rect x="-23" y="31"  width="46" height="46" rx="7"/>
      <rect x="31"  y="31"  width="46" height="46" rx="7"/>
    </g>
    <rect x="-125.25" y="-125.25" width="250.5" height="250.5" rx="55.25"
          fill="none" stroke="#a78bfa" stroke-opacity="0.38" stroke-width="3"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="210" y="190" font-size="52" font-weight="700" letter-spacing="-0.6" fill="#f5f2ff">Obsidian Skills</text>
    <text x="210" y="227" font-size="21" fill="#bdb4dd">Nine independent Agent Skills for Obsidian vaults.</text>
    <text x="211" y="259" font-size="14.5" letter-spacing="0.3" fill="#8f86b3">Markdown · Bases · Canvas · Mermaid · Visualize</text>
    <text x="211" y="279" font-size="14.5" letter-spacing="0.3" fill="#8f86b3">CLI · Clipper · Doctor · Sync</text>
    <rect x="210" y="300" width="228" height="32" rx="16" fill="#8b5cf6" fill-opacity="0.13"
          stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.2"/>
    <text x="324" y="321" font-size="12.5" font-weight="600" letter-spacing="1.5" text-anchor="middle"
          fill="#cfc6ee">LOCAL · UNRELEASED 0.1.0</text>
  </g>

  <path d="M 812 74 V 326" stroke="#a78bfa" stroke-opacity="0.16" stroke-width="1.4"/>

  <!-- Nine separate tiles: identical size and corner radius, none central, none emphasised. -->
  <g fill="#1e1840" fill-opacity="0.92" stroke="#a78bfa" stroke-opacity="0.30" stroke-width="1.3">
    <rect x="884"  y="38"  width="96" height="96" rx="22"/>
    <rect x="998"  y="38"  width="96" height="96" rx="22"/>
    <rect x="1112" y="38"  width="96" height="96" rx="22"/>
    <rect x="884"  y="152" width="96" height="96" rx="22"/>
    <rect x="998"  y="152" width="96" height="96" rx="22"/>
    <rect x="1112" y="152" width="96" height="96" rx="22"/>
    <rect x="884"  y="266" width="96" height="96" rx="22"/>
    <rect x="998"  y="266" width="96" height="96" rx="22"/>
    <rect x="1112" y="266" width="96" height="96" rx="22"/>
  </g>

  <!-- Markdown: double brackets. -->
  <g transform="translate(932 86)" fill="none" stroke="#cdbcff" stroke-width="2.6"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M -11 -14 H -17 V 14 H -11"/>
    <path d="M -2 -14 H -8 V 14 H -2"/>
    <path d="M 2 -14 H 8 V 14 H 2"/>
    <path d="M 11 -14 H 17 V 14 H 11"/>
  </g>

  <!-- Bases: header row plus two data rows and a column rule. -->
  <g transform="translate(1046 86)">
    <rect x="-17" y="-15" width="34" height="9" rx="2.6" fill="#a78bfa"/>
    <rect x="-17" y="-2.5" width="34" height="8" rx="2.4" fill="none" stroke="#cdbcff" stroke-width="2.2"/>
    <rect x="-17" y="9" width="34" height="8" rx="2.4" fill="none" stroke="#cdbcff" stroke-width="2.2"/>
    <path d="M 2 -2.5 V 17" stroke="#cdbcff" stroke-opacity="0.5" stroke-width="1.6"/>
  </g>

  <!-- Canvas: three nodes joined by edges. -->
  <g transform="translate(1160 86)" fill="none" stroke="#cdbcff" stroke-width="2.3"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="-19" y="-18" width="15" height="14" rx="3.2"/>
    <rect x="4" y="-18" width="15" height="14" rx="3.2"/>
    <rect x="-7.5" y="6" width="15" height="14" rx="3.2"/>
    <path d="M -4 -11 H 4"/>
    <path d="M -11.5 -4 L -3.5 6"/>
    <path d="M 11.5 -4 L 3.5 6"/>
  </g>

  <!-- Mermaid: a decision diamond branching to two terminals. -->
  <g transform="translate(932 200)">
    <g fill="none" stroke="#cdbcff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0 -19 L 12 -8 L 0 3 L -12 -8 Z"/>
      <path d="M 0 3 V 8"/>
      <path d="M -11 8 H 11"/>
      <path d="M -11 8 V 12"/>
      <path d="M 11 8 V 12"/>
    </g>
    <circle cx="-11" cy="16" r="3.4" fill="#a78bfa"/>
    <circle cx="11" cy="16" r="3.4" fill="#a78bfa"/>
  </g>

  <!-- Visualize: three bars on a baseline. -->
  <g transform="translate(1046 200)">
    <rect x="-14.5" y="0" width="9" height="12.5" rx="2.6" fill="#a78bfa"/>
    <rect x="-4.5" y="-9" width="9" height="21.5" rx="2.6" fill="#b9a6ff"/>
    <rect x="5.5" y="-16" width="9" height="28.5" rx="2.6" fill="#56c8f5"/>
    <path d="M -17 15 H 17" fill="none" stroke="#cdbcff" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- CLI: prompt chevron and input rule. -->
  <g transform="translate(1160 200)" fill="none" stroke="#cdbcff" stroke-width="2.8"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M -15 -9 L -5 0 L -15 9"/>
    <path d="M 0 9 H 15"/>
  </g>

  <!-- Clipper: a page with a clipped corner. -->
  <g transform="translate(932 314)" fill="none" stroke="#cdbcff" stroke-width="2.4"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M -14 -17 H 5 L 15 -7 V 17 H -14 Z"/>
    <path d="M 5 -17 V -7 H 15"/>
    <path d="M -7 3 H 8"/>
    <path d="M -7 10 H 3"/>
  </g>

  <!-- Doctor: a pulse trace inside a circle. -->
  <g transform="translate(1046 314)" fill="none" stroke="#cdbcff" stroke-width="2.4"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="0" r="17"/>
    <path d="M -11 1 H -5.5 L -2.5 -7.5 L 2 7.5 L 5 1 H 11"/>
  </g>

  <!-- Sync: two arcs closing a cycle. -->
  <g transform="translate(1160 314)">
    <g>
      <path d="M -13.156 -4.788 A 14 14 0 0 1 12.982 -5.243"
            fill="none" stroke="#cdbcff" stroke-width="2.6" stroke-linecap="round"/>
      <polygon points="15.55,1.79 9.40,-3.42 16.91,-6.16" fill="#a78bfa"/>
    </g>
    <g transform="rotate(180)">
      <path d="M -13.156 -4.788 A 14 14 0 0 1 12.982 -5.243"
            fill="none" stroke="#cdbcff" stroke-width="2.6" stroke-linecap="round"/>
      <polygon points="15.55,1.79 9.40,-3.42 16.91,-6.16" fill="#a78bfa"/>
    </g>
  </g>

  <rect x="0.7" y="0.7" width="1278.6" height="398.6" rx="27.5"
        fill="none" stroke="#a78bfa" stroke-opacity="0.30" stroke-width="1.4"/>
</svg>
